name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, test, and package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build, test, and dry-run the Worker package
        run: npm run check

      - name: Verify generated bundles are current
        run: |
          git diff --exit-code -- \
            public/projects/chargeback-studio/supabase.js \
            public/projects/revenue-leak-finder/revenue-leak-finder.js \
            public/projects/bidlens/bidlens.js \
            public/projects/scopefence/scopefence.js
